    <link rel="icon" type="image/png" href="/logo.png" />

    />
    <link rel="canonical" href="https://labsite.id/" />

    <!-- OpenGraph. Values are the Indonesian defaults; LanguageProvider rewrites
        og:title / og:description / og:locale on every language switch so crawlers
        and social scrapers always see the locale actually being served. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LABSITE.ID" />
    <meta property="og:title" content="LABSITE.ID — Mitra Rekayasa TI Profesional" />
    <meta
      property="og:description"
      content="LABSITE.ID adalah mitra rekayasa sistem untuk UMKM dan bisnis lokal: diagnosis dulu, lalu arsitektur, lalu kode — custom-built, zero bloat, terukur."
    />
    <meta property="og:url" content="https://labsite.id/" />
    <meta property="og:image" content="https://labsite.id/logo.png" />
    <meta property="og:image:alt" content="Logo LABSITE.ID" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- https://ogp.me/#twitter-card summary, so shared links render a card on X. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LABSITE.ID — Mitra Rekayasa TI Profesional" />
    <meta
      name="twitter:description"
      content="LABSITE.ID adalah mitra rekayasa sistem untuk UMKM dan bisnis lokal — custom-built, zero bloat, terukur."
    />
    <meta name="twitter:image" content="https://labsite.id/logo.png" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF8F5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#120E0C" />

    <!--
      Pre-paint bootstrap.

      Two jobs, both of which must happen before the first paint or the visitor
      sees a flash:

        1. Theme. The `dark` class has to be on <html> before React mounts, or
           the page renders light and then snaps dark — a white flash on every
           dark-mode load.

        2. Language. `lang` is read from the same localStorage key the app
           uses. Without this the document announces `lang="id"` while the
           English UI is already rendered, so a screen reader picks the wrong
           pronunciation rules until React's effect runs.

      Both are written to attributes only, never to localStorage: this runs
      before the app exists, and the app's effect is the single writer that
      persists changes. Writing here too would create two sources of truth.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var storedTheme = localStorage.getItem('labsite-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = storedTheme || (prefersDark ? 'dark' : 'light');
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;

          var storedLang = localStorage.getItem('labsite-lang');
          if (storedLang === 'en' || storedLang === 'id') {
            root.lang = storedLang;
          }
        } catch (e) {
          /* private mode or storage disabled: defaults in the markup stand */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Fonts.

      `display=swap` paints the metric-matched fallback immediately (see the
      `size-adjust` declarations in index.css) so the swap is visually
      seamless and layout-neutral. It also means the stylesheet itself must not
      block first paint — a render-blocking font CSS request adds ~100ms of
      blank screen on a cold cache, which is worse than the swap it protects.
      Hence `media="print" onload="this.media='all'"`: non-blocking in every
      browser that supports it, with a plain `<noscript>` stylesheet as the
      fallback for the rest.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Structured data. `@graph` keeps the ProfessionalService and its owning
        Organization in one response; the service catalogue mirrors the four
        engineering pillars shown on the page so the schema and the UI never
        describe different offerings. -->

      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "@id": "https://labsite.id/#service",
            "name": "LABSITE.ID",
            "url": "https://labsite.id/",
            "logo": "https://labsite.id/logo.png",
            "parentOrganization": { "@id": "https://labsite.id/#organization" },
            "description": "Mitra rekayasa sistem untuk UMKM dan bisnis lokal di Indonesia: diagnosis dulu, lalu arsitektur, lalu kode — custom-built, zero bloat, dan terukur.",
            "priceRange": "$$",
            "areaServed": { "@type": "Country", "name": "Indonesia" },
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Layanan Rekayasa Digital",
              "itemListElement": [
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Kehadiran Digital",
                    "description": "Company website, landing page, katalog produk, dan profil bisnis yang ditemukan mesin pencari."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Digitalisasi Proses",
                    "description": "Menghilangkan kerja manual lewat alur kerja digital, form online, dan pengelolaan data terpusat."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Sistem Bisnis",
                    "description": "Sistem manajemen, dashboard, database, dan inventori yang memberi satu sumber kebenaran."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Otomasi & Integrasi",
                    "description": "Otomasi alur kerja, integrasi API dan WhatsApp, serta pelaporan otomatis."
                  }
                }
              ]
            }
          },
          {
            "@type": "Organization",
            "@id": "https://labsite.id/#organization",
            "name": "LABSITE.ID",
            "url": "https://labsite.id/",
            "logo": "https://labsite.id/logo.png",
            "email": "hello@labsite.id",
            "areaServed": { "@type": "Country", "name": "Indonesia" },
            "knowsAbout": [
              "Software Engineering",
              "Web Development",
              "Database Systems",
              "Business Process Automation",
              "Digital Presence"
            ],
            "sameAs": []
          }
        ]
      }

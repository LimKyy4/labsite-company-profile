<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF8F5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LABSITE.ID — Professional IT Engineering Partner</title>
    <meta
      name="description"
      content="LABSITE.ID adalah mitra rekayasa sistem untuk UMKM dan bisnis lokal. Kami mentransformasi operasional yang berantakan menjadi sistem digital yang otomatis, andal, dan terukur — custom-built, zero bloat, type-safe."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF8F5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#120E0C" />
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('labsite-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = stored || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
